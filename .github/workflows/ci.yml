name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

  container-smoke-test:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: takdata:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and wait for /healthz
        run: |
          docker volume create takdata-ci
          # Simulate a volume written by the old root-run image
          docker run --rm -v takdata-ci:/data alpine sh -c 'touch /data/config.db && chown 0:0 /data/config.db'
          docker run -d --name takdata -p 8000:8000 -v takdata-ci:/app/data -e AUTH_ENABLED=false takdata:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/v1/enablement-types
          # `docker exec` runs as root; check the server process (PID 1) and
          # the volume it now owns instead.
          test "$(docker exec takdata sh -c "grep '^Uid:' /proc/1/status | cut -f2")" = "1001"
          test "$(docker exec takdata stat -c %u /app/data/config.db)" = "1001"

      - name: Container logs
        if: always()
        run: docker logs takdata || true
